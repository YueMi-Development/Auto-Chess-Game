services:
  # ---------------------------------------------------------------------------
  # Shared cargo cache (must be declared before services that use it)
  # ---------------------------------------------------------------------------
  cargo_cache:
    image: alpine:3.19
    volumes:
      - cargo_cache:/usr/local/cargo/registry
      - cargo_cache_target:/app/target
    entrypoint: ["echo", "cargo_cache volume ready"]

  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Admin gRPC Gateway — thin Rust gRPC service for all backend pairing.
  # Reads admin_panel DB directly; no Laravel dependency.
  # ---------------------------------------------------------------------------
  backend-admin-grpc:
    build:
      context: ./Backend/Backend-AdminGrpc
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${ADMIN_GRPC_PORT:-50052}:50052"
    environment:
      GRPC_ADDR: 0.0.0.0:50052
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ADMIN_DATABASE_NAME:-admin_panel}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Admin Panel (Laravel)
  # ---------------------------------------------------------------------------
  admin-panel:
    build:
      context: ./Admin-Area/Admin-Panel
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: "Auto Chess Admin"
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-false}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${ADMIN_DATABASE_NAME:-admin_panel}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      BACKEND_GENERAL_URL: ${BACKEND_GENERAL_URL:-http://backend-general:8081}
    volumes:
      - ./Admin-Area/Admin-Panel:/var/www
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-3001}:80"
    volumes:
      - ./Admin-Area/Admin-Panel:/var/www
      - ./docker/nginx/laravel.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - admin-panel

  # ---------------------------------------------------------------------------
  # Backend General — Lobby Service (Rust, port 8081 / gRPC 50051)
  # ---------------------------------------------------------------------------
  backend-general:
    build:
      context: ./Backend/Backend-General
      dockerfile: Dockerfile
      args:
        CARGO_HOME: /usr/local/cargo
    restart: unless-stopped
    ports:
      - "${GENERAL_HTTP_PORT:-8081}:8081"
      - "${GENERAL_GRPC_PORT:-50051}:50051"
    environment:
      PORT: 8081
      GRPC_PORT: 50051
      HTTP_ADDR: 0.0.0.0:8081
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ADMIN_DATABASE_NAME:-admin_panel}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${GENERAL_JWT_SECRET}
      BACKEND_MATCHMAKING_URL: http://backend-matchmaking:8083
      BACKEND_SIMULATION_URL: http://backend-simulation:8082
      CREDS_MANAGER_URL: http://nginx:80
      CREDS_MANAGER_AUTH_KEY: ${CREDS_MANAGER_AUTH_KEY:-}
      CREDS_MANAGER_SCOPES: ${CREDS_MANAGER_SCOPES:-}
      ADMIN_GRPC_ADDR: backend-admin-grpc:50052
    volumes:
      - cargo_cache:/usr/local/cargo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Backend Matchmaking — Queue Service (Rust, port 8083)
  # ---------------------------------------------------------------------------
  backend-matchmaking:
    build:
      context: ./Backend/Backend-Matchmaking
      dockerfile: ../docker/images/backend-matchmaking.Dockerfile
      args:
        CARGO_HOME: /usr/local/cargo
    restart: unless-stopped
    ports:
      - "${MATCHMAKING_PORT:-8083}:8083"
    environment:
      REDIS_URL: redis://redis:6379
      BACKEND_MATCHGAMES_URL: http://backend-matchgames:8084
      ADMIN_GRPC_ADDR: backend-admin-grpc:50052
    volumes:
      - cargo_cache:/usr/local/cargo
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Backend MatchGames — Match Lifecycle (Rust, port 8084)
  # ---------------------------------------------------------------------------
  backend-matchgames:
    build:
      context: ./Backend/Backend-MatchGames
      dockerfile: ../docker/images/backend-matchgames.Dockerfile
      args:
        CARGO_HOME: /usr/local/cargo
    restart: unless-stopped
    ports:
      - "${MATCHGAMES_PORT:-8084}:8084"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ADMIN_DATABASE_NAME:-admin_panel}?sslmode=disable
      BACKEND_SIMULATION_URL: http://backend-simulation:8082
      BACKEND_GENERAL_URL: http://backend-general:8081
      ADMIN_GRPC_ADDR: backend-admin-grpc:50052
    volumes:
      - cargo_cache:/usr/local/cargo
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Backend Simulation — Combat Engine (Rust, port 8082)
  # ---------------------------------------------------------------------------
  backend-simulation:
    build:
      context: ./Backend/Backend-Simulation
      dockerfile: Dockerfile
      args:
        CARGO_HOME: /usr/local/cargo
    restart: unless-stopped
    ports:
      - "${SIMULATION_PORT:-8082}:8082"
    environment:
      HTTP_ADDR: 0.0.0.0:8082
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${ADMIN_DATABASE_NAME:-admin_panel}?sslmode=disable
      BACKEND_GENERAL_GRPC_ADDR: backend-general:50051
      CREDS_MANAGER_URL: http://nginx:80
      CREDS_MANAGER_AUTH_KEY: ${CREDS_MANAGER_AUTH_KEY:-}
      CREDS_MANAGER_SCOPES: ${CREDS_MANAGER_SCOPES:-}
      ADMIN_GRPC_ADDR: backend-admin-grpc:50052
    volumes:
      - cargo_cache:/usr/local/cargo
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  cargo_cache:
