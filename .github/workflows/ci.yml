name: CI

on:
  pull_request:
    branches: ["master", "development"]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tag info ────────────────────────────────────────────────────────────────
  tag-info:
    name: Tag Info
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  # ── Release: create GitHub Release ────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [tag-info]
    if: needs.tag-info.outputs.is_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Extract changelog section
        id: changelog
        run: |
          python3 .github/scripts/get_changelog.py "${{ needs.tag-info.outputs.tag }}" > changelog_body.txt
          {
            echo "body<<EOF"
            cat changelog_body.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Rust Backends ──────────────────────────────────────────────────────────
  backend-general:
    name: Backend-General (test + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Backend/Backend-General
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  backend-simulation:
    name: Backend-Simulation (test + build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: Backend/Backend-Simulation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  # ── Godot Linux export ─────────────────────────────────────────────────────
  godot-linux:
    name: Godot Export (Linux)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7
    needs: [tag-info]
    defaults:
      run:
        working-directory: Frontend/Game-Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.7.stable ~/.local/share/godot/export_templates/4.7.stable

      - name: Export Linux
        run: |
          mkdir -v build
          godot --headless --export-release "Linux"

      - name: Copy to release name
        run: |
          cd build
          cp game-client-linux.x86_64 "../AutoChess-Game-Client-linux-x86_64"

      - name: Upload to GitHub Release
        if: needs.tag-info.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          files: |
            Frontend/Game-Client/AutoChess-Game-Client-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Godot Windows export ───────────────────────────────────────────────────
  godot-windows:
    name: Godot Export (Windows)
    runs-on: windows-latest
    needs: [tag-info]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Download Godot
        shell: pwsh
        run: |
          $godotDir = "$env:LOCALAPPDATA\Godot"
          New-Item -ItemType Directory -Force -Path $godotDir
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64_console.exe" -OutFile "$godotDir\godot.exe"
          Expand-Archive "$godotDir\godot.exe" -DestinationPath $godotDir -Force
          Remove-Item "$godotDir\godot.exe"

      - name: Export Windows
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:LOCALAPPDATA\Godot\*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "Frontend\Game-Client\build"
          Set-Location "Frontend\Game-Client"
          & $godot.FullName --headless --export-release "Windows Desktop" "build\game-client-windows.exe"

      - name: Upload to GitHub Release
        if: needs.tag-info.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          files: |
            Frontend/Game-Client/build/game-client-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Godot Android export ───────────────────────────────────────────────────
  godot-android:
    name: Godot Export (Android)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/yuemi-development/godot-android
    needs: [tag-info]
    defaults:
      run:
        working-directory: Frontend/Game-Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Export Android
        run: |
          mkdir -v build
          godot --headless --export-release "Android"

      - name: Copy to release name
        run: |
          cd build
          cp AutoChess-Game-Client-android.apk "../AutoChess-Game-Client-android.apk"

      - name: Upload to GitHub Release
        if: needs.tag-info.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          files: |
            Frontend/Game-Client/AutoChess-Game-Client-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
