name: CI

on:
  pull_request:
    branches: ["master", "development"]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tag info ────────────────────────────────────────────────────────────────
  tag-info:
    name: Tag Info
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_release: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

  # ── Commit Skip Parser ──────────────────────────────────────────────────────
  parser:
    name: Commit Skip Parser
    runs-on: ubuntu-22.04
    outputs:
      skip_general: ${{ steps.parse.outputs.skip_general }}
      skip_simulation: ${{ steps.parse.outputs.skip_simulation }}
      skip_admin_grpc: ${{ steps.parse.outputs.skip_admin_grpc }}
      skip_matchmaking: ${{ steps.parse.outputs.skip_matchmaking }}
      skip_matchgames: ${{ steps.parse.outputs.skip_matchgames }}
      skip_godot: ${{ steps.parse.outputs.skip_godot }}
      skip_roblox: ${{ steps.parse.outputs.skip_roblox }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect commits
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "${{ github.event.pull_request.title }}" > commits.txt
            git log ${{ github.event.pull_request.base.sha }}..HEAD --format=%B >> commits.txt
          else
            git log --format=%B -n 50 > commits.txt
          fi

      - name: Parse skip flags
        id: parse
        run: python3 .github/scripts/parse_commit_skip.py "$(cat commits.txt)"

  # ── Release: create GitHub Release ────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-22.04
    needs: [tag-info]
    if: needs.tag-info.outputs.is_release == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Extract changelog section
        id: changelog
        run: |
          python3 .github/scripts/get_changelog.py "${{ needs.tag-info.outputs.tag }}" > changelog_body.txt
          {
            echo "body<<EOF"
            cat changelog_body.txt
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Rust Backends ──────────────────────────────────────────────────────────
  backend-general:
    name: Backend-General (test + build)
    runs-on: ubuntu-22.04
    needs: [parser]
    if: needs.parser.outputs.skip_general != 'true'
    defaults:
      run:
        working-directory: Backend/Backend-General
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  backend-simulation:
    name: Backend-Simulation (test + build)
    runs-on: ubuntu-22.04
    needs: [parser]
    if: needs.parser.outputs.skip_simulation != 'true'
    defaults:
      run:
        working-directory: Backend/Backend-Simulation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  backend-admin-grpc:
    name: Backend-AdminGrpc (build)
    runs-on: ubuntu-22.04
    needs: [parser]
    if: needs.parser.outputs.skip_admin_grpc != 'true'
    defaults:
      run:
        working-directory: Backend/Backend-AdminGrpc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  backend-matchmaking:
    name: Backend-Matchmaking (build)
    runs-on: ubuntu-22.04
    needs: [parser]
    if: needs.parser.outputs.skip_matchmaking != 'true'
    defaults:
      run:
        working-directory: Backend/Backend-Matchmaking
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  backend-matchgames:
    name: Backend-MatchGames (build)
    runs-on: ubuntu-22.04
    needs: [parser]
    if: needs.parser.outputs.skip_matchgames != 'true'
    defaults:
      run:
        working-directory: Backend/Backend-MatchGames
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test

      - name: Build release
        run: cargo build --release

  # ── Godot Linux export ─────────────────────────────────────────────────────
  godot-linux:
    name: Godot Export (Linux)
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7
    needs: [parser, tag-info]
    if: needs.parser.outputs.skip_godot != 'true'
    defaults:
      run:
        working-directory: Frontend/Game-Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Setup export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/4.7.stable ~/.local/share/godot/export_templates/4.7.stable

      - name: Export Linux
        run: |
          mkdir -v build
          godot --headless --export-release "Linux"

      - name: Copy to release name
        run: |
          cd build
          cp game-client-linux.x86_64 "../AutoChess-Game-Client-linux-x86_64"

      - name: Upload to GitHub Release
        if: needs.tag-info.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          files: |
            Frontend/Game-Client/AutoChess-Game-Client-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Godot Windows export ───────────────────────────────────────────────────
  godot-windows:
    name: Godot Export (Windows)
    runs-on: windows-latest
    needs: [parser, tag-info]
    if: needs.parser.outputs.skip_godot != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Download Godot
        shell: pwsh
        run: |
          $godotDir = "$env:LOCALAPPDATA\Godot"
          New-Item -ItemType Directory -Force -Path $godotDir
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_win64_console.exe" -OutFile "$godotDir\godot.exe"
          Expand-Archive "$godotDir\godot.exe" -DestinationPath $godotDir -Force
          Remove-Item "$godotDir\godot.exe"

      - name: Export Windows
        shell: pwsh
        run: |
          $godot = Get-ChildItem "$env:LOCALAPPDATA\Godot\*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "Frontend\Game-Client\build"
          Set-Location "Frontend\Game-Client"
          & $godot.FullName --headless --export-release "Windows Desktop" "build\game-client-windows.exe"

      - name: Upload to GitHub Release
        if: needs.tag-info.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          files: |
            Frontend/Game-Client/build/game-client-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Godot Android export ───────────────────────────────────────────────────
  godot-android:
    name: Godot Export (Android)
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/yuemi-development/godot-android
    needs: [parser, tag-info]
    if: needs.parser.outputs.skip_godot != 'true'
    defaults:
      run:
        working-directory: Frontend/Game-Client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          token: ${{ secrets.GH_PAT }}
          submodules: recursive

      - name: Export Android
        run: |
          mkdir -v build
          godot --headless --export-release "Android"

      - name: Copy to release name
        run: |
          cd build
          cp AutoChess-Game-Client-android.apk "../AutoChess-Game-Client-android.apk"

      - name: Upload to GitHub Release
        if: needs.tag-info.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag-info.outputs.tag }}
          files: |
            Frontend/Game-Client/AutoChess-Game-Client-android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Roblox Lua tests + lint ──────────────────────────────────────────────────
  roblox:
    name: Game-Roblox (tests + lint)
    runs-on: ubuntu-22.04
    needs: [parser]
    if: needs.parser.outputs.skip_roblox != 'true'
    defaults:
      run:
        working-directory: Frontend/Game-Roblox
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install lune
        run: curl -fsSL https://raw.githubusercontent.com/lune-org/lune/master/install.sh | bash

      - name: Run unit tests
        run: lune run tests/run.lua

      - name: Install luau-analyze
        run: |
          curl -fsSL https://github.com/luau-lang/luau/releases/latest/download/luau-linux.zip -o luau.zip
          unzip -o luau.zip

      - name: Type check
        run: luau-analyze src/
